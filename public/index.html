<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daman WinGo Simulation</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background-color: #f7f8ff; margin: 0; padding: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: #fff; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .nav-header { background: linear-gradient(90deg,#2979ff,#0045c4); color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        
        /* Auth Container Layout */
        .auth-box { padding: 20px; margin: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #fdfdfd; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-action { width: 100%; padding: 10px; background: #0045c4; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        
        /* Dashboard System */
        .game-dashboard { display: none; padding: 10px; }
        .wallet-banner { background: linear-gradient(135deg,#ff9800,#f57c00); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; font-weight: bold; }
        .round-bar { display: flex; justify-content: space-between; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 14px; }
        
        /* Selection Controls */
        .bet-buttons { margin-top: 15px; text-align: center; }
        .row-grid { display: flex; gap: 8px; margin-bottom: 8px; }
        .choice-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        .choice-green { background: #10b981; } .choice-red { background: #ef4444; } .choice-violet { background: #8b5cf6; }
        .choice-big { background: #eab308; } .choice-small { background: #3b82f6; }
        
        /* Records Output Layout */
        .history-wrap { margin-top: 20px; }
        .history-header { font-size: 15px; font-weight: bold; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
        .data-table { width: 100%; border-collapse: collapse; text-align: center; margin-top: 10px; }
        .data-table th { font-size: 12px; color: #64748b; padding: 8px; background: #f8fafc; }
        .data-table td { padding: 10px 6px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        .ball-icon { display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; color: white; font-weight: bold; font-size: 12px; }
        
        .c-Green { background: #10b981; } .c-Red { background: #ef4444; } .c-Violet { background: #8b5cf6; }
        .t-Big { color: #eab308; font-weight: bold; } .t-Small { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-header">Win Go 1Min</div>

    <!-- REGISTER / LOGIN SYSTEM OVERLAY -->
    <div id="auth-panel" class="auth-box">
        <h4 style="margin-top:0; color:#1e293b;">Login / Registration</h4>
        <div class="input-group">
            <label>Mobile Number</label>
            <input type="text" id="auth-mobile" class="form-input" placeholder="Enter Mobile">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="auth-pass" class="form-input" placeholder="Enter Password">
        </div>
        <button class="btn-action" onclick="handleAuth('login')">Login</button>
        <button class="btn-action" style="background:#64748b;" onclick="handleAuth('register')">Register Account</button>
    </div>

    <!-- MAIN ACTIVE GAME DASHBOARD -->
    <div id="game-panel" class="game-dashboard">
        <div class="wallet-banner">
            <span>Balance Wallet</span>
            <span id="display-wallet">₹0.00</span>
        </div>

        <div class="round-bar">
            <div>Period: <span id="round-period" style="font-weight:700;">Loading...</span></div>
            <div style="text-align:right;">Time Left: <span id="round-timer" style="font-weight:800; color:#ef4444;">60</span>s</div>
        </div>

        <div class="bet-buttons">
            <input type="number" id="stake-amount" class="form-input" value="10" style="text-align:center; margin-bottom:10px;" placeholder="Bet Amount (₹)">
            <div class="row-grid">
                <button class="choice-btn choice-green" onclick="submitBet('Green')">Green</button>
                <button class="choice-btn choice-violet" onclick="submitBet('Violet')">Violet</button>
                <button class="choice-btn choice-red" onclick="submitBet('Red')">Red</button>
            </div>
            <div class="row-grid">
                <button class="choice-btn choice-big" onclick="submitBet('Big')">Big</button>
                <button class="choice-btn choice-small" onclick="submitBet('Small')">Small</button>
            </div>
        </div>

        <div class="history-wrap">
            <div class="history-header">Recent History</div>
            <table class="data-table">
                <thead><tr><th>Period</th><th>Number</th><th>Size</th><th>Color</th></tr></thead>
                <tbody id="history-data-rows"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let currentSessionUser = null;
    let fallbackWallet = 100.00;

    socket.on('timer_update', (data) => {
        document.getElementById('round-timer').innerText = data.timer;
        document.getElementById('round-period').innerText = data.nextPeriod;
    });

    async function handleAuth(type) {
        const mobile = document.getElementById('auth-mobile').value.trim();
        const password = document.getElementById('auth-pass').value.trim();
        if(!mobile || !password) return alert("Fill all elements!");

        try {
            const response = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile, password })
            });
            const data = await response.json();
            if(data.error) return alert(data.error);

            alert(data.message);
            if(type === 'login' || data.message.includes('success')) {
                currentSessionUser = mobile;
                document.getElementById('auth-panel').style.display = 'none';
                document.getElementById('game-panel').style.display = 'block';
                document.getElementById('display-wallet').innerText = `₹${fallbackWallet.toFixed(2)}`;
            }
        } catch (e) {
            alert("Auth Request Failed.");
        }
    }

    function submitBet(betType) {
        if(!currentSessionUser) return alert("Login first!");
        const amt = parseFloat(document.getElementById('stake-amount').value);
        if(isNaN(amt) || amt <= 0) return alert("Invalid amount input");
        if(fallbackWallet < amt) return alert("Insufficient account funds!");

        fallbackWallet -= amt;
        document.getElementById('display-wallet').innerText = `₹${fallbackWallet.toFixed(2)}`;
        alert(`Bet of ₹${amt} locked on ${betType}!`);
    }

    socket.on('round_ended', (result) => {
        const row = `<tr>
            <td style="color:#64748b;">${result.period}</td>
            <td><span class="ball-icon c-${result.color}">${result.number}</span></td>
            <td class="t-${result.size}">${result.size}</td>
            <td style="color:${result.color==='Green'?'#10b981':'#ef4444'}">${result.color}</td>
        </tr>`;
        document.getElementById('history-data-rows').insertAdjacentHTML('afterbegin', row);
    });
</script>
</body>
</html>
