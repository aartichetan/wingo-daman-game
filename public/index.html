<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DmFirst Game Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background-color: #031711; margin: 0; padding: 0; display: flex; justify-content: center; color: #fff; }
        .app-shell { width: 100%; max-width: 450px; background: #012217; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px; }
        
        /* Top Navigation Navbar */
        .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; font-weight: bold; font-size: 18px; color: #f5bc5c; text-align: center; width: 100%; box-sizing: border-box; }
        
        /* Premium Wallet Card Design */
        .wallet-container { background: #044b35; border-radius: 16px; padding: 20px; box-sizing: border-box; margin-bottom: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .wallet-balance { font-size: 32px; font-weight: 800; color: #f5bc5c; margin: 5px 0; }
        .wallet-label { font-size: 13px; color: #a3c7bd; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .wallet-actions { display: flex; gap: 15px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-withdraw { background: #10b981; color: white; }
        .btn-deposit { background: transparent; border: 1px solid #10b981; color: #10b981; }

        /* Game Modes Grid Blocks */
        .game-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .mode-box { background: #073829; border-radius: 12px; padding: 12px 5px; text-align: center; font-size: 11px; color: #a3c7bd; border: 1px solid transparent; font-weight: 600; }
        .mode-box.active { background: #10b981; color: white; border-color: #5cebb4; }
        .mode-icon { width: 24px; height: 24px; margin: 0 auto 6px auto; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        /* Timer Block Section Container */
        .timer-section { background: #044b35; border-radius: 14px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background-image: radial-gradient(circle at right, #04523a, #044b35); }
        .balls-row { display: flex; gap: 4px; margin-top: 8px; }
        .period-display-text { font-size: 14px; font-weight: bold; color: #fff; margin-top: 8px; font-family: monospace; }
        .countdown-digits { display: flex; gap: 4px; margin-top: 5px; }
        .digit-box { background: #fff; color: #000; font-weight: 800; font-size: 20px; padding: 4px 8px; border-radius: 4px; }

        /* Large Color Selection Slots */
        .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .color-selector { padding: 14px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .sel-green { background: #10b981; } .sel-violet { background: #a855f7; } .sel-red { background: #ef4444; }

        /* Numerical Buttons Panel Grid Layout */
        .numbers-container { background: #032b20; border-radius: 14px; padding: 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px; }
        .num-ball { width: 100%; aspect-ratio: 1; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -4px 8px rgba(0,0,0,0.3); }
        
        /* Exact Colors mapping according to standard rules */
        .n-0 { background: linear-gradient(135deg, #a855f7 50%, #ef4444 50%); }
        .n-5 { background: linear-gradient(135deg, #a855f7 50%, #10b981 50%); }
        .n-1, .n-3, .n-7, .n-9 { background: #10b981; }
        .n-2, .n-4, .n-6, .n-8 { background: #ef4444; }

        /* Small History Badges */
        .mini-ball { width: 24px; height: 24px; line-height: 24px; border-radius: 50%; color: white; text-align: center; font-weight: bold; font-size: 11px; display: inline-block; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="top-navbar">
        <span>‹</span> <span>DMFirst</span> <span>🎧 🎵</span>
    </div>

    <!-- WALLET DISPLAY CARD BLOCK -->
    <div class="wallet-container">
        <div class="wallet-balance">₹2,660.00</div>
        <div class="wallet-label">💼 WALLET BALANCE ↻</div>
        <div class="wallet-actions">
            <button class="action-btn btn-withdraw" onclick="alert('Withdraw feature coming soon!')">Withdraw</button>
            <button class="action-btn btn-deposit" onclick="alert('Deposit feature coming soon!')">Deposit</button>
        </div>
    </div>

    <!-- GAME MODES SELECTION ROW -->
    <div class="game-modes">
        <div class="mode-box">
            <div class="mode-icon">🕒</div>WinGo 30sec
        </div>
        <div class="mode-box active">
            <div class="mode-icon">🕒</div>WinGo 1 Min
        </div>
        <div class="mode-box">
            <div class="mode-icon">🕒</div>WinGo 3 Min
        </div>
        <div class="mode-box">
            <div class="mode-icon">🕒</div>WinGo 5 Min
        </div>
    </div>

    <!-- MAIN ACTIVE LIVE TIMER CARD SYSTEM -->
    <div class="timer-section">
        <div>
            <button style="background:transparent; border:1px solid #a3c7bd; color:white; border-radius:15px; padding:3px 12px; font-size:11px;">📋 How to play</button>
            <div style="font-size:12px; margin-top:8px; color:#a3c7bd;">WinGo 1 Min</div>
            <div class="balls-row" id="top-mini-history"></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size:12px; color:#a3c7bd; font-weight:600;">Time remaining</div>
            <div class="countdown-digits">
                <div class="digit-box">0</div><div class="digit-box">0</div>
                <div style="color:white; font-size:20px; font-weight:bold; padding:0 2px;">:</div>
                <div class="digit-box" id="t-min">3</div><div class="digit-box" id="t-sec">0</div>
            </div>
            <div class="period-display-text" id="display-period-string">20261101100010874</div>
        </div>
    </div>

    <!-- COLOUR BET PANEL GRID -->
    <div class="color-grid">
        <button class="color-selector sel-green" onclick="betAction('Green')">Green</button>
        <button class="color-selector sel-violet" onclick="betAction('Violet')">Violet</button>
        <button class="color-selector sel-red" onclick="betAction('Red')">Red</button>
    </div>

    <!-- NUMBER BALL SELECTION INTERFACE MATRIX -->
    <div class="numbers-container">
        <button class="num-ball n-0" onclick="betAction('0')">0</button>
        <button class="num-ball n-1" onclick="betAction('1')">1</button>
        <button class="num-ball n-2" onclick="betAction('2')">2</button>
        <button class="num-ball n-3" onclick="betAction('3')">3</button>
        <button class="num-ball n-4" onclick="betAction('4')">4</button>
        <button class="num-ball n-5" onclick="betAction('5')">5</button>
        <button class="num-ball n-6" onclick="betAction('6')">6</button>
        <button class="num-ball n-7" onclick="betAction('7')">7</button>
        <button class="num-ball n-8" onclick="betAction('8')">8</button>
        <button class="num-ball n-9" onclick="betAction('9')">9</button>
    </div>
</div>

<script>
    const socket = io();

    socket.on('timer_update', (data) => {
        // Convert timer remaining digits to display layout format
        let minutesDigit = Math.floor(data.timer / 10);
        let secondsDigit = data.timer % 10;
        
        document.getElementById('t-min').innerText = minutesDigit;
        document.getElementById('t-sec').innerText = secondsDigit;
        document.getElementById('display-period-string').innerText = data.nextPeriod;

        // Render mini round timeline history elements inside card
        renderMiniHistory(data.history);
    });

    socket.on('round_ended', (data) => {
        renderMiniHistory(data.history);
        alert(`Round Completed! Number: ${data.result.number} (${data.result.color})`);
    });

    function renderMiniHistory(historyList) {
        const targetContainer = document.getElementById('top-mini-history');
        targetContainer.innerHTML = '';
        
        // Take latest 5 elements to map perfectly into header layout
        let previewItems = historyList.slice(0, 5).reverse();
        previewItems.forEach(item => {
            let colorClass = `n-${item.number}`;
            targetContainer.insertAdjacentHTML('beforeend', `<span class="mini-ball ${colorClass}">${item.number}</span>`);
        });
    }

    function betAction(targetSelection) {
        alert(`Selection Locked: Bet placed successfully on [${targetSelection}]!`);
    }
</script>
</body>
</html>
