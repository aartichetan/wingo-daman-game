<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daman Pro App with Betting</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .daman-container { width: 100%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px; text-align: center; }
        .wallet-card { background: #e0f2fe; margin: 15px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .info-bar { display: flex; justify-content: space-between; padding: 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .timer-val { font-size: 28px; font-weight: bold; color: #ef4444; }
        
        /* Betting Panel Style */
        .bet-panel { padding: 15px; text-align: center; }
        .btn-row { display: flex; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-green { background: #10b981; } .btn-red { background: #ef4444; } .btn-violet { background: #8b5cf6; }
        .btn-big { background: #f59e0b; } .btn-small { background: #3b82f6; }
        .input-amount { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-size: 16px; }
        
        /* History Table */
        .history-section { padding: 15px; }
        .daman-table { width: 100%; border-collapse: collapse; text-align: center; }
        .daman-table th { background: #f8fafc; padding: 10px; font-size: 13px; border-bottom: 2px solid #e2e8f0; }
        .daman-table td { padding: 10px; font-size: 14px; border-bottom: 1px solid #f1f5f9; }
        .ball { display: inline-block; width: 24px; height: 24px; line-height: 24px; border-radius: 50%; color: white; font-weight: bold; }
        .bg-Green { background: #10b981; } .bg-Red { background: #ef4444; } .bg-Violet { background: #8b5cf6; }

        /* Manual Verifier Box */
        .verifier-box { width: 100%; max-width: 450px; background: #334155; color: white; border-radius: 20px; padding: 20px; box-sizing: border-box; }
        .verify-input { width: 100%; padding: 8px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        .verify-btn { width: 100%; padding: 10px; background: #10b981; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- MAIN DAMAN APP INTERFACE -->
    <div class="daman-container">
        <div class="header"><h2>🏆 DAMAN CLUB GAME</h2></div>
        
        <div class="wallet-card">
            <span>💰 Balance:</span>
            <span id="wallet-balance">₹10,000.00</span>
        </div>

        <div class="info-bar">
            <div><div>Period</div><div id="next-period" style="font-weight:bold;">Loading...</div></div>
            <div><div>Time</div><div class="timer-val" id="timer-box">60</div></div>
        </div>

        <!-- BETTING PANEL -->
        <div class="bet-panel">
            <input type="number" id="bet-amount" class="input-amount" value="100" placeholder="Enter Amount (₹)">
            <div class="btn-row">
                <button class="btn btn-green" onclick="placeBet('Green')">Green</button>
                <button class="btn btn-violet" onclick="placeBet('Violet')">Violet</button>
                <button class="btn btn-red" onclick="placeBet('Red')">Red</button>
            </div>
            <div class="btn-row">
                <button class="btn btn-big" onclick="placeBet('Big')">Big</button>
                <button class="btn btn-small" onclick="placeBet('Small')">Small</button>
            </div>
            <div style="font-size: 11px; color:#64748b;">Current Hash: <span id="curr-hash" style="word-break:break-all;"></span></div>
        </div>

        <!-- HISTORY TABLE -->
        <div class="history-section">
            <table class="daman-table">
                <thead><tr><th>Period</th><th>Number</th><th>Size</th><th>Color</th></tr></thead>
                <tbody id="history-rows"></tbody>
            </table>
        </div>
    </div>

    <!-- MANUAL PROVABLY FAIR VERIFIER -->
    <div class="verifier-box">
        <h3>🔍 Past Round Verifier (Check Legitimacy)</h3>
        <p style="font-size:12px; color:#cbd5e1;">Daman ka ya apne server ka purana unhashed Seed aur Period daal kar verify karein:</p>
        <label>Unhashed Server Seed:</label>
        <input type="text" id="v-seed" class="verify-input" placeholder="e.g. 9b8d2f1a...">
        <label>Period Number:</label>
        <input type="text" id="v-period" class="verify-input" placeholder="e.g. 202611030001">
        <button class="verify-btn" onclick="verifyPastRound()">Verify Calculation</button>
        <div id="verify-result" style="margin-top:15px; font-weight:bold; font-size:15px; text-align:center;"></div>
    </div>

    <!-- UTILITY SCRIPTS USING CRYPTO-JS FOR BROWSER VERIFYING -->
    <script src="https://cloudflare.com"></script>
    <script>
        const socket = io();
        
        socket.on('timer_update', (data) => {
            document.getElementById('timer-box').innerText = data.timer;
            document.getElementById('next-period').innerText = data.nextPeriod;
            document.getElementById('curr-hash').innerText = data.currentHash;
        });

        socket.on('wallet_update', (balance) => {
            document.getElementById('wallet-balance').innerText = `₹${balance}.00`;
        });

        socket.on('bet_success', msg => alert(msg));
        socket.on('error_msg', msg => alert(msg));

        function placeBet(type) {
            const amount = parseInt(document.getElementById('bet-amount').value);
            socket.emit('place_bet', { type: type, amount: amount });
        }

        socket.on('round_ended', (result) => {
            const rowHtml = `<tr>
                <td>${result.period}<br><small style="font-size:9px;color:gray;">Seed: ${result.serverSeed.substring(0,8)}...</small></td>
                <td><span class="ball bg-${result.color}">${result.number}</span></td>
                <td>${result.size}</td>
                <td style="color:${result.color === 'Green'?'green':'red'}">${result.color}</td>
            </tr>`;
            document.getElementById('history-rows').insertAdjacentHTML('afterbegin', rowHtml);
        });

        // MANUAL VERIFIER CALCULATION (Asli Daman logic verification browser par)
        function verifyPastRound() {
            const seed = document.getElementById('v-seed').value.trim();
            const period = document.getElementById('v-period').value.trim();
            if(!seed || !period) return alert("Dono fields bharna zaroori hai!");

            let clientSeed = "daman_client_secure"; 
            let combinedMessage = `${clientSeed}:${period}`;
            
            // HMAC-SHA512 calculation on frontend
            let hash = CryptoJS.HmacSHA512(combinedMessage, seed).toString(CryptoJS.enc.Hex);
            let hexString = hash.substring(0, 8);
            let decimalNumber = parseInt(hexString, 16);
            let finalNumber = decimalNumber % 10;
            
            let color = (finalNumber === 0 || finalNumber === 5) ? "Violet" : (finalNumber % 2 === 0 ? "Red" : "Green");
            let size = (finalNumber >= 5) ? "Big" : "Small";

            document.getElementById('verify-result').innerHTML = `Calculated Result:<br>💥 Number: ${finalNumber} | Size: ${size} | Color: ${color}`;
        }
    </script>
</body>
</html>
