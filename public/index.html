<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DmFirst Live Interface</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background-color: #031711; margin: 0; padding: 0; display: flex; justify-content: center; color: #fff; user-select: none; }
        .app-shell { width: 100%; max-width: 450px; background: #012217; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px; position: relative; }
        
        /* Navbar */
        .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; font-weight: bold; font-size: 18px; color: #f5bc5c; }
        
        /* Auth Screen Panel */
        .auth-panel { background: #044b35; padding: 25px; border-radius: 16px; margin-top: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #a3c7bd; margin-bottom: 5px; font-weight: 600; }
        .form-input { width: 100%; padding: 12px; border: 1px solid #10b981; background: #012217; color: white; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .btn-auth { width: 100%; padding: 12px; background: #10b981; border: none; color: white; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }

        /* Main Game Engine (Hidden initially) */
        .game-panel { display: none; }
        
        /* Wallet Layout */
        .wallet-container { background: #044b35; border-radius: 16px; padding: 20px; margin-bottom: 15px; text-align: center; }
        .wallet-balance { font-size: 32px; font-weight: 800; color: #f5bc5c; margin: 5px 0; }
        .wallet-label { font-size: 13px; color: #a3c7bd; font-weight: 600; }
        .wallet-actions { display: flex; gap: 15px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-withdraw { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
        .btn-deposit { background: #10b981; color: white; }

        /* Modes Grid */
        .game-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .mode-box { background: #073829; border-radius: 12px; padding: 12px 5px; text-align: center; font-size: 11px; color: #a3c7bd; font-weight: 600; }
        .mode-box.active { background: #10b981; color: white; }

        /* Timer Block Section */
        .timer-section { background: #044b35; border-radius: 14px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balls-row { display: flex; gap: 4px; margin-top: 8px; }
        .countdown-digits { display: flex; gap: 4px; margin-top: 5px; }
        .digit-box { background: #fff; color: #000; font-weight: 800; font-size: 20px; padding: 4px 8px; border-radius: 4px; }

        /* Color Selection Grid */
        .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .color-selector { padding: 14px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .sel-green { background: #10b981; } .sel-violet { background: #a855f7; } .sel-red { background: #ef4444; }

        /* Numbers Selection Matrix */
        .numbers-container { background: #032b20; border-radius: 14px; padding: 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px; }
        .num-ball { width: 100%; aspect-ratio: 1; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .n-0 { background: linear-gradient(135deg, #a855f7 50%, #ef4444 50%); }
        .n-5 { background: linear-gradient(135deg, #a855f7 50%, #10b981 50%); }
        .n-1, .n-3, .n-7, .n-9 { background: #10b981; }
        .n-2, .n-4, .n-6, .n-8 { background: #ef4444; }
        .mini-ball { width: 24px; height: 24px; line-height: 24px; border-radius: 50%; color: white; text-align: center; font-weight: bold; font-size: 11px; display: inline-block; }

        /* Sliding Betting Bottom Sheet Popup (Real App Function) */
        .bet-sheet-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; }
        .bet-sheet { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background: #044b35; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; transition: bottom 0.3s ease; z-index: 1000; }
        .bet-sheet.open { bottom: 0; }
        .sheet-header { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 15px; color: #f5bc5c; }
        .chip-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .chip { flex: 1; padding: 8px; background: #012217; border: 1px solid #10b981; text-align: center; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chip.active { background: #10b981; color: white; }
        
        /* Payout History Logger */
        .history-logger { background: #032b20; border-radius: 12px; padding: 12px; margin-top: 10px; }
        .log-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #044b35; font-size: 13px; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="top-navbar"><span>‹</span> <span>DMFirst Portal</span> <span>🎧</span></div>

    <!-- DYNAMIC ACCESS CONTROLLERS (Auth System) -->
    <div id="auth-box" class="auth-panel">
        <h3 style="margin-top:0; text-align:center; color:#f5bc5c;">Welcome to DmFirst</h3>
        <div class="input-group"><label>Mobile Numbers</label><input type="text" id="phone" class="form-input" placeholder="Enter Mobile Number"></div>
        <div class="input-group"><label>Account Password</label><input type="password" id="pass" class="form-input" placeholder="Enter Password"></div>
        <button class="btn-auth" onclick="authAction('login')">Login Dashboard</button>
        <button class="btn-auth" style="background:transparent; border:1px solid #10b981; color:#10b981;" onclick="authAction('register')">Register New Account</button>
    </div>

    <!-- CORE LIVE SIMULATION SYSTEM PANEL -->
    <div id="game-box" class="game-panel">
        <div class="wallet-container">
            <div class="wallet-balance" id="wallet-val">₹0.00</div>
            <div class="wallet-label">💼 WALLET BALANCE ↻</div>
            <div class="wallet-actions">
                <button class="action-btn btn-withdraw" onclick="alert('Withdraw request submitted to gateway verification!')">Withdraw</button>
                <button class="action-btn btn-deposit" onclick="triggerDeposit()">Deposit Cash</button>
            </div>
        </div>

        <div class="game-modes">
            <div class="mode-box active">WinGo 30s</div><div class="mode-box">WinGo 1m</div>
            <div class="mode-box">WinGo 3m</div><div class="mode-box">WinGo 5m</div>
        </div>

        <div class="timer-section">
            <div>
                <span style="font-size:12px; color:#a3c7bd;">WinGo 30s Record</span>
                <div class="balls-row" id="mini-history"></div>
            </div>
            <div style="text-align: right;">
                <div class="countdown-digits"><div class="digit-box">0</div><div class="digit-box">0</div><div style="padding:0 2px;">:</div><div class="digit-box" id="m-digit">0</div><div class="digit-box" id="s-digit">0</div></div>
                <div style="font-size:12px; margin-top:5px; font-family:monospace;" id="period-txt">00000000000</div>
            </div>
        </div>

        <div class="color-grid">
            <button class="color-selector sel-green" onclick="openBetSheet('Green')">Green</button>
            <button class="color-selector sel-violet" onclick="openBetSheet('Violet')">Violet</button>
            <button class="color-selector sel-red" onclick="openBetSheet('Red')">Red</button>
        </div>

        <div class="numbers-container">
            <button class="num-ball n-0" onclick="openBetSheet('0')">0</button>
            <button class="num-ball n-1" onclick="openBetSheet('1')">1</button>
            <button class="num-ball n-2" onclick="openBetSheet('2')">2</button>
            <button class="num-ball n-3" onclick="openBetSheet('3')">3</button>
            <button class="num-ball n-4" onclick="openBetSheet('4')">4</button>
            <button class="num-ball n-5" onclick="openBetSheet('5')">5</button>
            <button class="num-ball n-6" onclick="openBetSheet('6')">6</button>
            <button class="num-ball n-7" onclick="openBetSheet('7')">7</button>
            <button class="num-ball n-8" onclick="openBetSheet('8')">8</button>
            <button class="num-ball n-9" onclick="openBetSheet('9')">9</button>
        </div>

        <div class="history-logger">
            <div style="font-weight:bold; font-size:14px; margin-bottom:8px; color:#f5bc5c;">Recent Records Table</div>
            <div id="log-rows-container"></div>
        </div>
    </div>

    <!-- DYNAMIC BET SLIDING MODAL SHEET -->
    <div class="bet-sheet-overlay" id="sheet-overlay" onclick="closeBetSheet()"></div>
    <div class="bet-sheet" id="bet-sheet">
        <div class="sheet-header">Select Amount for [<span id="sheet-target"></span>]</div>
        <div class="chip-row">
            <div class="chip active" onclick="setBaseAmt(10, this)">₹10</div>
            <div class="chip" onclick="setBaseAmt(100, this)">₹100</div>
